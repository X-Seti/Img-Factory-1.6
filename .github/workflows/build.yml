# this belongs in root /.github/workflows/build.yml - Version: 5
# X-Seti - October 29 2026 - IMG Factory 1.6 core + Full builds, installers on Windows / Linux / macOS (x64 + arm64)
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        variant: [core, full]                             # Img_Factory, Img_Factory_Full
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # App Settings System holds the shared utils, themes, images some repos leave out.
      - name: Checkout App Settings System
        if: hashFiles('apps/utils/app_settings_system.py') == ''
        uses: actions/checkout@v4
        with:
          repository: X-Seti/App-Settings-System
          path: _app_settings

      # Local symlinks to App-Settings-System arrive broken (or as text files on Windows): replaced.
      - name: Add shared utils, themes, images
        if: hashFiles('apps/utils/app_settings_system.py') == ''
        shell: python
        run: |
          import os, shutil
          for d in ('utils', 'themes', 'images'):
              p = os.path.join('apps', d)
              if os.path.isdir(p) and not os.path.islink(p):
                  continue
              if os.path.lexists(p):
                  try:
                      os.remove(p)                 # broken link / text stub
                  except OSError:
                      os.rmdir(p)                  # Windows directory link
              shutil.copytree(os.path.join('_app_settings', 'apps', d), p)
          shutil.rmtree('_app_settings')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 xvfb xauth portaudio19-dev liblzo2-dev

      - name: Audio / LZO libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio lzo

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build, test, package
        env:
          PYTHONUTF8: '1'
        run: python buildscript.py --ci --variant ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*_Setup.exe
            dist/*.dmg

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release latest-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest-build out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "${{ github.event.repository.name }} - latest build" \
            --notes "Built from main. Img_Factory = IMG Factory with core tools; Img_Factory_Full = every workshop. Windows: run the _Setup.exe (or unzip and run). macOS: open the .dmg, drag the app to Applications (first start: right-click > Open). Linux: tar -xzf, then ./install.sh in the folder (adds a menu entry), or run the program directly."
